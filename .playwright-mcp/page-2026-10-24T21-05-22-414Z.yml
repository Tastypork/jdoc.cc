    - generic [ref=f2e55]:
      - group "1 / 14" [ref=f2e56]:
        - generic [ref=f2e60]:
          - text: Senior Software Engineer
          - paragraph [ref=f2e61]: I currently work at Walmart as a Senior Software Engineer, focusing on database cost optimization and the integration of AI solutions to improve efficiency across large-scale operations.
      - group "2 / 14" [ref=f2e62]:
        - generic [ref=f2e66]:
          - text: Cloud Software Engineer
          - paragraph [ref=f2e67]: I worked at Intel as a Cloud Software Engineer, collaborating with high-profile clients to enhance workload performance and cost efficiency. My responsibilities included enhancing compression pipelines, doubling throughput for Kafka workloads, and managing cloud environments across AWS, GCP, and Azure.
      - group "3 / 14" [ref=f2e68]:
        - generic [ref=f2e72]:
          - text: Cloud Software Engineer
          - paragraph [ref=f2e73]: For two years, I specialized in FFmpeg and media optimization, working closely with media-based clients. This required expertise in transcoding techniques and leveraging the latest hardware optimizations for efficient media processing. I completed and launched Benchmarking software which improved operations by 5x.
      - group "4 / 14" [ref=f2e74]:
        - generic [ref=f2e78]:
          - text: Software Engineer
          - paragraph [ref=f2e79]: I collaborated with the Process Engineering and Statistics team to develop automation scripts and data visualizations for the fab. Using Python, I consolidated CSV files and queried relational databases, creating interactive visualizations with Plotly.
      - group "5 / 14" [ref=f2e80]:
        - generic [ref=f2e84]:
          - text: Master's Degree!
          - paragraph [ref=f2e85]: Completing my Master's degree was a significant achievement, especially as I navigated both my accident and COVID restrictions, often studying while bedridden in the hospital. With a concentration in Big Data and Software Engineering, it was the most challenging academic experience I’ve faced, making the accomplishment even more meaningful.
      - group "6 / 14" [ref=f2e86]:
        - generic [ref=f2e90]:
          - text: A Second Chance at Life
          - paragraph [ref=f2e91]: God saved my life! In 2020, a motorcycle accident radically changed everything, leaving me paralyzed from the waist down. I spent four months in the hospital and another two in recovery. Despite the challenges, I continued my studies, and to this day, I am grateful for every breath.
      - group "7 / 14" [ref=f2e92]:
        - generic [ref=f2e96]:
          - text: Bachelors Degree
          - paragraph [ref=f2e97]: I completed my undergraduate degree in just 3.5 years, earning a Bachelor's in Computer Science with a focus in Cybersecurity from Arizona State University. It was a challenging yet rewarding journey that fueled my passion for technology and problem-solving. Through hands-on projects and rigorous coursework, I developed skills in data structures and algorithms and software development. Proud to say—Forks Up!
      - group "8 / 14" [ref=f2e98]:
        - generic [ref=f2e102]:
          - text: Starting My Role At Intel
          - paragraph [ref=f2e103]: I landed my first job at Intel, joining the Process Engineering team for Software Engineering where I focused on developing software solutions. My main responsibilities involved creating data visualizations to support engineering processes, enabling more informed decision-making and operational improvements.
      - group "9 / 14" [ref=f2e104]:
        - generic [ref=f2e108]:
          - text: First Internship
          - paragraph [ref=f2e109]: I had the pleasure of working with American Express over the summer as part of the Big Data Platform Engineering team, where I primarily focused on managing Hadoop clusters and Kubernetes. This experience deepened my understanding of big data infrastructure and cloud-native technologies.
      - group "10 / 14" [ref=f2e110]:
        - generic [ref=f2e114]:
          - text: Undergraduate Teaching Assistant
          - paragraph [ref=f2e115]: I served as a teaching assistant for Professor Rita Bazzi in the Principles of Programming Languages course. I helped students understand key concepts such as regular expressions (regex), syntax, semantics, and the distinctions between compilers and interpreters. It was a rewarding experience that reinforced my own understanding while supporting students in mastering complex programming principles.
      - group "11 / 14" [ref=f2e116]:
        - generic [ref=f2e120]:
          - text: Started ASU
          - paragraph [ref=f2e121]: Beginning my journey at Arizona State University was the start of an exciting chapter in my life. I had the privilege of competing in Track and Field at a highly competitive level, which taught me invaluable lessons in discipline, perseverance, and time management. Balancing athletics with academics in Computer Science pushed me to grow both as an athlete and a student. My time at ASU laid the foundation for everything that came after, and I'm grateful for the opportunities and experiences it provided.
      - group "12 / 14" [ref=f2e122]:
        - generic [ref=f2e126]:
          - text: First Website
          - paragraph [ref=f2e127]: In high school, I created my first website after learning HTML and CSS. It was all about soup—a fun and quirky project that, sadly, I didn't keep around. Looking back, it was a pretty tasty-looking website, and it sparked my passion for web development!
      - group "13 / 14" [ref=f2e128]:
        - generic [ref=f2e132]:
          - text: First Coding Experience
          - paragraph [ref=f2e133]: A long time ago, I had my first coding experience in Minecraft using Java. I created a mod for a 'chocolate' ore that dropped 100 diamonds—it was pretty rough, but a fun introduction to programming. Looking back, it's amazing how much both Minecraft and my coding skills have evolved since then.
      - group "14 / 14" [ref=f2e134]:
        - generic [ref=f2e138]:
          - text: I was born!
          - paragraph [ref=f2e139]: A young programmer was born this year, with countless exciting experiences waiting just around the corner!
